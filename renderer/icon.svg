<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="iconBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1F2E"/>
      <stop offset="100%" stop-color="#080A0F"/>
    </linearGradient>

    <linearGradient id="iconGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D1"/>
      <stop offset="30%" stop-color="#FDE074"/>
      <stop offset="70%" stop-color="#F5C242"/>
      <stop offset="100%" stop-color="#C28410"/>
    </linearGradient>

    <linearGradient id="iconGoldBright" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#FCE182"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5C242"/>
    </linearGradient>

    <radialGradient id="iconGlow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#F5C242" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#F5C242" stop-opacity="0"/>
    </radialGradient>

    <filter id="iconSoftGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Squircle -->
  <rect x="2" y="2" width="60" height="60" rx="14"
        fill="url(#iconBg)"
        stroke="#D4A338" stroke-width="1.2" stroke-opacity="0.6"/>

  <!-- Inner Soft Ambient Glow -->
  <circle cx="32" cy="30" r="24" fill="url(#iconGlow)"/>

  <!-- Calendar Top Binder Clasps -->
  <rect x="20" y="8" width="4" height="7" rx="2" fill="url(#iconGold)"/>
  <rect x="40" y="8" width="4" height="7" rx="2" fill="url(#iconGold)"/>

  <!-- Calendar Top Ribbon Divider -->
  <path d="M 12 18 L 52 18" stroke="#D4A338" stroke-width="1" stroke-linecap="round" opacity="0.4"/>

  <!-- Central Symbol: Golden Crescent & Pagoda Spire Hti -->
  <g filter="url(#iconSoftGlow)">
    <!-- Crescent Moon (Waxing) -->
    <path d="M 32 19
             C 41 19 46 25 46 33
             C 46 41 40 47 32 47
             C 38 43 40 37 40 33
             C 40 27 36 22 32 19 Z"
          fill="url(#iconGold)"/>

    <!-- Pagoda Stupa Spire (Centrally Aligned) -->
    <!-- Base Plinth -->
    <path d="M 27 49 L 37 49 L 35 46 L 29 46 Z" fill="url(#iconGold)"/>
    <!-- Dome Base -->
    <path d="M 29 46 C 29 41 35 41 35 46 Z" fill="url(#iconGoldBright)"/>
    <!-- Central Needle / Spire -->
    <line x1="32" y1="41" x2="32" y2="25" stroke="url(#iconGoldBright)" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Hti Tier Rings -->
    <ellipse cx="32" cy="30" rx="4" ry="1.2" fill="url(#iconGold)"/>
    <ellipse cx="32" cy="27" rx="3" ry="1" fill="url(#iconGold)"/>
    <!-- Diamond Bud Crown Star -->
    <circle cx="32" cy="23" r="1.3" fill="#FFFFFF"/>
  </g>

  <!-- Bottom 3 Calendar Indicator Dots -->
  <circle cx="23" cy="54" r="1.8" fill="#4ADE80"/> <!-- Auspicious Yatyaza -->
  <circle cx="32" cy="54" r="2.2" fill="url(#iconGold)"/> <!-- Current Day Indicator -->
  <circle cx="41" cy="54" r="1.8" fill="#38BDF8"/> <!-- Event / Moon day -->

</svg>
