<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A1F2C"/>
      <stop offset="40%" stop-color="#10131B"/>
      <stop offset="100%" stop-color="#07080C"/>
    </linearGradient>

    <radialGradient id="ambientGlow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#F5C242" stop-opacity="0.18"/>
      <stop offset="50%" stop-color="#E5A920" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Imperial Gold Gradients -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF3C4"/>
      <stop offset="25%" stop-color="#FDE074"/>
      <stop offset="55%" stop-color="#F5C242"/>
      <stop offset="85%" stop-color="#D4971E"/>
      <stop offset="100%" stop-color="#8C5808"/>
    </linearGradient>

    <linearGradient id="goldBright" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#FFF9E0"/>
      <stop offset="40%" stop-color="#FCE182"/>
      <stop offset="75%" stop-color="#F5C242"/>
      <stop offset="100%" stop-color="#B87D10"/>
    </linearGradient>

    <linearGradient id="goldRibbon" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#9C680A"/>
      <stop offset="25%" stop-color="#FCE182"/>
      <stop offset="50%" stop-color="#FFFDF5"/>
      <stop offset="75%" stop-color="#F5C242"/>
      <stop offset="100%" stop-color="#9C680A"/>
    </linearGradient>

    <!-- Calendar Slab Gradients -->
    <linearGradient id="calendarFace" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2433"/>
      <stop offset="60%" stop-color="#151924"/>
      <stop offset="100%" stop-color="#0E1118"/>
    </linearGradient>

    <linearGradient id="calendarHeader" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8A5A0A"/>
      <stop offset="35%" stop-color="#D99B26"/>
      <stop offset="50%" stop-color="#FCE58D"/>
      <stop offset="70%" stop-color="#D99B26"/>
      <stop offset="100%" stop-color="#6E4405"/>
    </linearGradient>

    <!-- Glass Specular Highlight -->
    <linearGradient id="glassSpecular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.32"/>
      <stop offset="35%" stop-color="#FFFFFF" stop-opacity="0.08"/>
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="borderSpecular" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE182" stop-opacity="0.6"/>
      <stop offset="40%" stop-color="#F5C242" stop-opacity="0.25"/>
      <stop offset="70%" stop-color="#1E2433" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#FCE182" stop-opacity="0.4"/>
    </linearGradient>

    <!-- Moon & Celestial -->
    <radialGradient id="moonGlow" cx="45%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="45%" stop-color="#FFF5CF"/>
      <stop offset="75%" stop-color="#FCE182"/>
      <stop offset="100%" stop-color="#E5A31E"/>
    </radialGradient>

    <!-- Astrological Accent Dots -->
    <radialGradient id="rubyGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFA2A2"/>
      <stop offset="60%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </radialGradient>

    <radialGradient id="emeraldGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="60%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </radialGradient>

    <radialGradient id="cyanGlow" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="60%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </radialGradient>

    <!-- Drop Shadows -->
    <filter id="shadowMain" x="-20%" y="-20%" width="140%" height="145%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.4"/>
    </filter>

    <filter id="goldGlowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.75"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Squircle Clip Path (Standard macOS App Icon continuous curve) -->
    <clipPath id="macOSSquircle">
      <path d="M 124 36
               C 56 36 36 56 36 124
               L 36 388
               C 36 456 56 476 124 476
               L 388 476
               C 456 476 476 456 476 388
               L 476 124
               C 476 56 456 36 388 36
               Z"/>
    </clipPath>
  </defs>

  <!-- ==================== MAIN ICON CONTAINER ==================== -->
  <g filter="url(#shadowMain)">
    <!-- Base Squircle with macOS Proportions -->
    <path d="M 124 36
             C 56 36 36 56 36 124
             L 36 388
             C 36 456 56 476 124 476
             L 388 476
             C 456 476 476 456 476 388
             L 476 124
             C 476 56 456 36 388 36
             Z"
          fill="url(#bgGradient)"/>

    <!-- Subtle Outer Bevel / Border -->
    <path d="M 124 36
             C 56 36 36 56 36 124
             L 36 388
             C 36 456 56 476 124 476
             L 388 476
             C 456 476 476 456 476 388
             L 476 124
             C 476 56 456 36 388 36
             Z"
          fill="none"
          stroke="url(#borderSpecular)"
          stroke-width="3"/>
  </g>

  <!-- Clipped Content for Ambient and Lighting Overlays -->
  <g clip-path="url(#macOSSquircle)">
    <!-- Ambient Radial Gold Light from Center -->
    <ellipse cx="256" cy="220" rx="220" ry="200" fill="url(#ambientGlow)"/>

    <!-- Background Astrological Ring Patterns -->
    <g opacity="0.16" stroke="url(#goldSheen)" fill="none" stroke-width="1.2">
      <!-- Concentric Celestial Spheres -->
      <circle cx="256" cy="256" r="192" stroke-dasharray="2 6"/>
      <circle cx="256" cy="256" r="168"/>
      <circle cx="256" cy="256" r="138" stroke-dasharray="4 8"/>
      <circle cx="256" cy="256" r="88" stroke-dasharray="1 5"/>

      <!-- 8 Astrological Cardinal & Diagonal Rays (8 Myanmar Planets / Weekdays) -->
      <line x1="256" y1="64" x2="256" y2="448"/>
      <line x1="64" y1="256" x2="448" y2="256"/>
      <line x1="120" y1="120" x2="392" y2="392"/>
      <line x1="120" y1="392" x2="392" y2="120"/>
    </g>

    <!-- Top-left Glass Specular Sheen (macOS signature glossy reflection) -->
    <path d="M 36 124 C 36 56 56 36 124 36 L 388 36 C 440 36 465 52 473 100 C 370 120 220 180 80 340 C 45 280 36 200 36 124 Z"
          fill="url(#glassSpecular)"/>
  </g>

  <!-- ==================== CALENDAR SLAB (ELEVATED HERO) ==================== -->
  <g filter="url(#shadowMain)">
    <!-- Calendar Body Slab -->
    <rect x="100" y="112" width="312" height="308" rx="28"
          fill="url(#calendarFace)"
          stroke="#2A3142" stroke-width="2"/>
    
    <!-- Inner Card Glow -->
    <rect x="101" y="113" width="310" height="306" rx="27"
          fill="none"
          stroke="url(#borderSpecular)" stroke-width="1.5" opacity="0.65"/>

    <!-- Calendar Header Gold Banner -->
    <path d="M 100 140 C 100 124.5 112.5 112 128 112 L 384 112 C 399.5 112 412 124.5 412 140 L 412 188 L 100 188 Z"
          fill="url(#calendarHeader)"/>

    <!-- Gold Header Bottom Accent Wire -->
    <line x1="100" y1="188" x2="412" y2="188" stroke="#FCE182" stroke-width="2" opacity="0.8"/>
    <line x1="100" y1="189" x2="412" y2="189" stroke="#784B05" stroke-width="1"/>

    <!-- Dual Mechanical Binding Rings / Clips -->
    <g filter="url(#softGlow)">
      <!-- Left Ring Clasp -->
      <rect x="168" y="94" width="20" height="38" rx="10" fill="url(#goldSheen)" stroke="#5A3A05" stroke-width="1.5"/>
      <ellipse cx="178" cy="113" rx="4" ry="7" fill="#0A0C12"/>
      
      <!-- Right Ring Clasp -->
      <rect x="324" y="94" width="20" height="38" rx="10" fill="url(#goldSheen)" stroke="#5A3A05" stroke-width="1.5"/>
      <ellipse cx="334" cy="113" rx="4" ry="7" fill="#0A0C12"/>
    </g>

    <!-- Calendar Month / Title in Header -->
    <text x="256" y="156"
          font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Noto Sans Myanmar', sans-serif"
          font-size="16"
          font-weight="800"
          letter-spacing="3"
          fill="#0B0D13"
          text-anchor="middle">
      MYANMAR
    </text>
    <text x="256" y="174"
          font-family="-apple-system, BlinkMacSystemFont, 'Noto Sans Myanmar', sans-serif"
          font-size="11"
          font-weight="700"
          letter-spacing="1"
          fill="#4A3102"
          text-anchor="middle">
      ၁၃၈၈ • ပြက္ခဒိန်
    </text>
  </g>

  <!-- ==================== CENTRAL HERO SYMBOL: CELESTIAL STUPA & MOON ==================== -->
  <g filter="url(#goldGlowFilter)">
    <!-- Aura Radial Flare behind Stupa & Moon -->
    <circle cx="256" cy="288" r="80" fill="url(#ambientGlow)" opacity="0.9"/>

    <!-- 1. SACRED BURMESE CRESCENT & FULL MOON MEDALLION -->
    <!-- Full Moon Base (Luminous Pearl-Gold) -->
    <circle cx="256" cy="272" r="48" fill="url(#moonGlow)" filter="url(#softGlow)"/>

    <!-- Waxing Crescent Accentuation (Intricate Nested Silhouette) -->
    <path d="M 256 224
             C 282.5 224 304 245.5 304 272
             C 304 298.5 282.5 320 256 320
             C 274 304 282 284 282 272
             C 282 256 274 238 256 224 Z"
          fill="url(#goldBright)"
          opacity="0.95"/>

    <!-- Delicate Craters / Radiant Moon Texture -->
    <ellipse cx="236" cy="260" rx="6" ry="5" fill="#EAB308" opacity="0.25"/>
    <ellipse cx="244" cy="284" rx="9" ry="8" fill="#EAB308" opacity="0.2"/>
    <ellipse cx="266" cy="296" rx="5" ry="4" fill="#EAB308" opacity="0.22"/>

    <!-- 2. IMPERIAL BURMESE PAGODA SPIRE / HTI (ထီးတော် / စေတီ) -->
    <!-- Sacred Spire Stack (Tiered Architecture) -->
    <!-- Spire Base Plinth -->
    <path d="M 230 354 L 282 354 L 276 342 L 236 342 Z" fill="url(#goldRibbon)"/>
    
    <!-- Tier 1 -->
    <path d="M 234 342 L 278 342 L 272 332 L 240 332 Z" fill="url(#goldBright)"/>
    <!-- Tier 2 -->
    <path d="M 238 332 L 274 332 L 268 322 L 244 322 Z" fill="url(#goldSheen)"/>
    <!-- Bell Shape Dome (ခေါင်းလောင်းပုံ) -->
    <path d="M 242 322 C 242 308 270 308 270 322 Z" fill="url(#goldBright)"/>
    
    <!-- Slender Golden Spire (ငှက်ပျောဖူး) -->
    <path d="M 253 308 L 259 308 L 257 248 L 255 248 Z" fill="url(#goldSheen)"/>

    <!-- Crown Hti Parasol Rings (ထီးတော်ဘုံအဆင့်ဆင့်) -->
    <ellipse cx="256" cy="264" rx="14" ry="3.5" fill="url(#goldRibbon)" stroke="#7A4D05" stroke-width="0.8"/>
    <ellipse cx="256" cy="256" rx="11" ry="3" fill="url(#goldRibbon)" stroke="#7A4D05" stroke-width="0.8"/>
    <ellipse cx="256" cy="248" rx="8" ry="2.2" fill="url(#goldRibbon)" stroke="#7A4D05" stroke-width="0.6"/>
    
    <!-- Diamond Bud Crown (စိန်ဖူးတော်) emitting Divine Starburst -->
    <circle cx="256" cy="236" r="3.5" fill="#FFFFFF"/>
    <!-- Diamond Ray Flares -->
    <path d="M 256 226 L 258 234 L 266 236 L 258 238 L 256 246 L 254 238 L 246 236 L 254 234 Z"
          fill="#FFFFFF" opacity="0.95"/>
  </g>

  <!-- ==================== CALENDAR MATRIX GRID & ASTROLOGICAL PILLS ==================== -->
  <g transform="translate(126, 360)">
    <!-- Weekday Dots / Mini Grid Tiles -->
    <!-- Row of 7 miniature astrological calendar cells -->
    <!-- Col 1: Sun -->
    <rect x="0" y="0" width="32" height="24" rx="6" fill="#1A1F2E" stroke="#2A3142" stroke-width="1"/>
    <circle cx="16" cy="12" r="3" fill="#EF4444"/> <!-- Sun (Red) -->

    <!-- Col 2: Mon -->
    <rect x="38" y="0" width="32" height="24" rx="6" fill="#1A1F2E" stroke="#2A3142" stroke-width="1"/>
    <circle cx="54" cy="12" r="3" fill="#F5C242"/> <!-- Mon (Gold) -->

    <!-- Col 3: Tue -->
    <rect x="76" y="0" width="32" height="24" rx="6" fill="#1A1F2E" stroke="#2A3142" stroke-width="1"/>
    <circle cx="92" cy="12" r="3" fill="#FB923C"/> <!-- Tue (Pink/Coral) -->

    <!-- Col 4: Wed (Center Selected Hero Cell - Yatyaza Auspicious) -->
    <rect x="114" y="-3" width="32" height="30" rx="8" fill="url(#goldSheen)" stroke="#FFF" stroke-width="1.2" filter="url(#softGlow)"/>
    <circle cx="130" cy="12" r="4.5" fill="#0B0D13"/> <!-- Center Active Dot -->

    <!-- Col 5: Thu -->
    <rect x="152" y="0" width="32" height="24" rx="6" fill="#1A1F2E" stroke="#2A3142" stroke-width="1"/>
    <circle cx="168" cy="12" r="3" fill="#4ADE80"/> <!-- Thu (Green) -->

    <!-- Col 6: Fri -->
    <rect x="190" y="0" width="32" height="24" rx="6" fill="#1A1F2E" stroke="#2A3142" stroke-width="1"/>
    <circle cx="206" cy="12" r="3" fill="#38BDF8"/> <!-- Fri (Blue) -->

    <!-- Col 7: Sat -->
    <rect x="228" y="0" width="32" height="24" rx="6" fill="#1A1F2E" stroke="#2A3142" stroke-width="1"/>
    <circle cx="244" cy="12" r="3" fill="#A78BFA"/> <!-- Sat (Purple) -->
  </g>

  <!-- Astrological Status Indicators (Floating Badges on Bottom Left & Right) -->
  <!-- Auspicious Tag: Yatyaza (Emerald) -->
  <g filter="url(#softGlow)">
    <circle cx="120" cy="304" r="9" fill="url(#emeraldGlow)"/>
    <circle cx="120" cy="304" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Countdown / Thingyan Tag: Sky Blue -->
  <g filter="url(#softGlow)">
    <circle cx="392" cy="304" r="9" fill="url(#cyanGlow)"/>
    <circle cx="392" cy="304" r="4" fill="#FFFFFF" opacity="0.9"/>
  </g>

  <!-- Star Embellishments -->
  <circle cx="140" cy="226" r="1.5" fill="#FCE182" opacity="0.7"/>
  <circle cx="372" cy="226" r="1.5" fill="#FCE182" opacity="0.7"/>
  <circle cx="160" cy="260" r="1" fill="#FFFFFF" opacity="0.5"/>
  <circle cx="352" cy="260" r="1" fill="#FFFFFF" opacity="0.5"/>

</svg>
